version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shared_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  image-service:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HOST=${HOST}
      - UPLOAD_DIR=/data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  db_data:
  uploads:
